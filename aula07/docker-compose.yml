services:
  postgres:
    image: postgres:17
    container_name: ditado-postgres
    environment:
      POSTGRES_USER: ditado
      POSTGRES_PASSWORD: ditado
      POSTGRES_DB: ditado
    ports:
      - "5432:5432"
    volumes:
      - ditado-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ditado -d ditado"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ditado-postgres-data:
